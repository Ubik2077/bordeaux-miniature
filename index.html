<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bordeaux Miniature</title>
<meta name="theme-color" content="#5a3b22">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/polices.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="feuille">
  <div id="carte" aria-label="Carte de Bordeaux, avec les lieux à visiter en relief"></div>
  <div class="flou haut"></div><div class="flou bas"></div><div class="lumiere"></div><div class="vignette"></div>
  <div class="cartouche">
    <h1>BORDEAUX<span>Miniature</span></h1>
    <p class="region">Musées · Familles · Shopping</p>
  </div>
  <button class="rose" id="rose" aria-label="Remettre le nord en haut">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="30" fill="rgba(244,235,215,.7)" stroke="#2f2a24" stroke-width="1"/>
      <circle cx="50" cy="50" r="36" fill="none" stroke="#2f2a24" stroke-width=".5"/>
      <path d="M50 8 L56 50 L50 56 L44 50 Z" fill="#8c2342"/><path d="M50 92 L56 50 L50 44 L44 50 Z" fill="#fff" stroke="#2f2a24" stroke-width="1"/>
      <path d="M8 50 L50 44 L56 50 L50 56 Z" fill="#fff" stroke="#2f2a24" stroke-width="1"/><path d="M92 50 L50 44 L44 50 L50 56 Z" fill="#2f2a24"/>
      <text x="50" y="7" text-anchor="middle" font-family="Cormorant Garamond, serif" font-weight="700" font-size="12" fill="#2f2a24">N</text>
    </svg>
  </button>
  <nav class="outils" aria-label="Catégories" data-i18n-aria="inventaire.aria">
    <button id="bouton-liste" class="etiquette-papier" aria-expanded="false" aria-controls="liste"><span class="ico">☰</span><span data-i18n="cats.liste">Liste</span></button>
    <button class="etiquette-papier" data-cat="musee" aria-pressed="true" style="--c:#8c2342"><i></i><span data-i18n="cats.musee">Musées</span></button>
    <button class="etiquette-papier" data-cat="famille" aria-pressed="true" style="--c:#4f8a46"><i></i><span data-i18n="cats.famille">Famille</span></button>
    <button class="etiquette-papier" data-cat="shopping" aria-pressed="true" style="--c:#d9772f"><i></i><span data-i18n="cats.shopping">Shopping</span></button>
  </nav>
  <aside id="liste" class="panneau panneau-liste" aria-labelledby="liste-titre" hidden>
    <button id="liste-fermer" class="fermer" aria-label="Fermer la liste" data-i18n-aria="liste.fermer">✕</button>
    <h2 id="liste-titre" data-i18n="liste.titre">Les lieux</h2>
    <p class="aide" data-i18n="liste.aide">Du plus proche au plus loin de l'hôtel, à pied.</p>
    <ul id="liste-lieux" class="liste-lieux"></ul>
  </aside>
  <aside id="fiche" class="panneau panneau-fiche" role="dialog" aria-labelledby="fiche-titre" hidden>
    <button id="fiche-fermer" class="fermer" aria-label="Fermer la fiche" data-i18n-aria="fiche.fermer">✕</button>
    <figure id="fiche-photo" class="photo"></figure>
    <div id="fiche-corps" class="corps"></div>
  </aside>
  <div id="barre-trajet" class="barre-trajet" hidden></div>
  <div class="chargement" id="chargement">Bordeaux se dessine…</div>
</div>
<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="js/carte.js"></script>
</body>
</html>
