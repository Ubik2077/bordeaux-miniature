<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bordeaux Miniature · affiche</title>
<!-- Affiche A5 pour la réception, inspirée des cartes « maquette » : la ville en relief découpée comme une île
     posée sur une carte de papier, monuments nommés par des lignes de rappel, QR code vers la carte.
     La vue 3D est dessinée à l'ouverture avec le même code que la carte, puis figée en image pour l'impression.
     Imprimer depuis le navigateur : format A5, marges « aucune », graphiques d'arrière-plan cochés. -->
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/polices.css">
<style>
  :root { --encre: #2f2a24; --encre-douce: #6e6355; --filet: #cdbb97; --vin: #8c2342; --titre: 'Cormorant Garamond', Georgia, serif; --texte: Inter, sans-serif; }
  @page { size: A5; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #6b5a45; font-family: var(--texte); color: var(--encre); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .affiche { position: relative; width: 148mm; height: 210mm; margin: 10mm auto; overflow: hidden; display: flex; flex-direction: column; align-items: center;
    background: #f4efe4; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  /* la carte de papier en fond : lignes de niveau et quadrillage très pâles */
  .fond { position: absolute; inset: 0; pointer-events: none; opacity: .55; }
  .haut { position: relative; z-index: 2; text-align: center; margin-top: 11mm; }
  h1 { margin: 0; font: 600 40pt/1 var(--titre); letter-spacing: .2em; padding-left: .2em; }
  .filet { width: 62mm; height: 0; margin: 2.2mm auto 0; border-top: .25mm solid var(--encre); position: relative; }
  .filet::after { content: ''; position: absolute; left: 50%; top: -1.1mm; width: 2mm; height: 2mm; background: #f4efe4; border: .25mm solid var(--encre); transform: translateX(-50%) rotate(45deg); }
  .sous { margin: 2.6mm 0 0; font: 600 7.2pt/1 var(--texte); letter-spacing: .32em; padding-left: .32em; }
  .sous-en { margin: 1.4mm 0 0; font: italic 500 9.5pt/1 var(--titre); color: var(--encre-douce); }
  /* l'île : la vue 3D découpée, avec son épaisseur et son ombre */
  .scene { position: relative; z-index: 1; width: 148mm; margin-top: 2mm; }
  .ile-ombre { position: absolute; left: 0; top: 0; transform-origin: top left; filter: blur(6px); opacity: .35; background: #3a2a14; }
  .ile-tranche { position: absolute; left: 0; top: 0; transform-origin: top left; background: linear-gradient(#a99271, #7d6748); }
  .ile { position: absolute; left: 0; top: 0; transform-origin: top left; overflow: hidden; background: #e9dfc8; }
  .ile img, .ile #carte { width: 100%; height: 100%; display: block; }
  .rappels { position: absolute; left: 0; top: 0; transform-origin: top left; overflow: visible; pointer-events: none; }
  .bas { position: relative; z-index: 2; margin-top: auto; width: 100%; padding: 0 11mm 9mm; text-align: center; }
  .bas h2 { margin: 0; font: 600 17pt/1 var(--titre); letter-spacing: .3em; padding-left: .3em; }
  .bas .pays { margin: 1.6mm 0 0; font: 600 6.5pt/1 var(--texte); letter-spacing: .4em; padding-left: .4em; }
  .scan { display: flex; align-items: center; gap: 5mm; margin-top: 4.5mm; text-align: left; padding-top: 3.5mm; border-top: .25mm solid var(--filet); }
  .qr { flex: none; width: 27mm; height: 27mm; padding: 1.6mm; background: #fff; border: .3mm solid var(--encre); }
  .qr svg { display: block; width: 100%; height: 100%; }
  .scan p { margin: 0; }
  .scan .fr { font: 600 13pt/1.05 var(--titre); }
  .scan .en { margin-top: .8mm; font: italic 500 10.5pt/1.1 var(--titre); color: var(--encre-douce); }
  .scan .url { margin-top: 1.8mm; font: 600 7pt/1 var(--texte); color: var(--vin); letter-spacing: .02em; }
  .scan .langues { margin-top: 1.6mm; font: 500 6.2pt/1 var(--texte); letter-spacing: .12em; color: var(--encre-douce); }
  .pied { margin-top: 2.6mm; font-size: 6pt; color: var(--encre-douce); display: flex; justify-content: space-between; }
  .attente { position: absolute; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; background: #f4efe4; font: italic 600 16pt var(--titre); color: var(--encre-douce); }
  .attente[hidden] { display: none; }
  .boutons { display: flex; justify-content: center; margin: 0 0 14px; }
  .boutons button { padding: 9px 18px; border: 0; border-radius: 4px; background: var(--encre); color: #f4efe4; font: 600 14px var(--texte); cursor: pointer; }
  @media print { body { background: none; } .affiche { margin: 0; box-shadow: none; } .boutons { display: none; } }
</style>
</head>
<body>
<main class="affiche">
  <svg class="fond" id="fond" viewBox="0 0 148 210" preserveAspectRatio="none" aria-hidden="true"></svg>
  <header class="haut">
    <h1>BORDEAUX</h1>
    <div class="filet"></div>
    <p class="sous">MUSÉES · FAMILLES · SHOPPING</p>
    <p class="sous-en">Museums · Families · Shopping</p>
  </header>
  <section class="scene" id="scene">
    <div class="ile-ombre" id="ile-ombre"></div>
    <div class="ile-tranche" id="ile-tranche"></div>
    <div class="ile" id="ile"><div id="carte"></div></div>
    <svg class="rappels" id="rappels"></svg>
  </section>
  <footer class="bas">
    <h2>BORDEAUX</h2>
    <p class="pays">FRANCE</p>
    <div class="scan">
      <div class="qr" id="qr"></div>
      <div>
        <p class="fr">Scannez pour explorer la carte</p>
        <p class="en">Scan with your phone camera to explore the map</p>
        <p class="url" id="url"></p>
        <p class="langues">FRANÇAIS · ENGLISH · ESPAÑOL · ITALIANO · DEUTSCH</p>
      </div>
    </div>
    <div class="pied"><span id="hotel"></span><span>Fond : IGN BD TOPO · © OpenStreetMap</span></div>
  </footer>
  <div class="attente" id="attente">Bordeaux se dessine…</div>
</main>
<div class="boutons"><button onclick="print()">Imprimer l’affiche (A5)</button></div>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/qrcode.js"></script>
<script type="module" src="js/affiche.js"></script>
</body>
</html>
