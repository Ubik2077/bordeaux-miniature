<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bordeaux Miniature · affiche</title>
<!-- Affiche A5 pour la réception : l'illustration « maquette » de Bordeaux montée comme un tirage sur papier,
     avec en dessous le QR code vers la carte, en cinq langues.
     Imprimer depuis le navigateur : format A5, marges « aucune », graphiques d'arrière-plan cochés. -->
<link rel="stylesheet" href="css/polices.css">
<style>
  :root { --encre: #2f2a24; --encre-douce: #6e6355; --filet: #cdbb97; --vin: #8c2342; --titre: 'Cormorant Garamond', Georgia, serif; --texte: Inter, sans-serif; }
  @page { size: A5; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #6b5a45; font-family: var(--texte); color: var(--encre); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .affiche { position: relative; width: 148mm; height: 210mm; margin: 10mm auto; overflow: hidden; display: flex; flex-direction: column; align-items: center;
    background: #f4efe4 radial-gradient(ellipse at 50% 40%, #f8f4ea 0%, #f1ead9 70%, #e9dfc8 100%); box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  /* l'illustration, montée comme un tirage : fin passe-partout blanc et ombre légère */
  .tirage { margin-top: 7mm; width: 128mm; padding: 1.2mm; background: #fffdf8; box-shadow: 0 .6mm 2.4mm rgba(60,40,15,.28), 0 0 0 .2mm rgba(60,40,15,.15); }
  .tirage img { display: block; width: 100%; aspect-ratio: 1086 / 1448; }
  .scan { display: flex; align-items: center; gap: 4.5mm; width: 128mm; margin-top: 4.2mm; }
  .qr { flex: none; width: 23mm; height: 23mm; padding: 1.4mm; background: #fff; border: .3mm solid var(--encre); }
  .qr svg { display: block; width: 100%; height: 100%; }
  .scan p { margin: 0; }
  .scan .themes { font: 600 6.4pt/1 var(--texte); letter-spacing: .3em; color: var(--vin); }
  .scan .fr { margin-top: 1.6mm; font: 600 13pt/1.05 var(--titre); }
  .scan .en { margin-top: .6mm; font: italic 500 10.5pt/1.1 var(--titre); color: var(--encre-douce); }
  .scan .url { margin-top: 1.5mm; font: 600 6.8pt/1 var(--texte); color: var(--vin); letter-spacing: .02em; }
  .scan .langues { margin-top: 1.3mm; font: 500 5.8pt/1 var(--texte); letter-spacing: .12em; color: var(--encre-douce); }
  .pied { width: 128mm; margin-top: auto; margin-bottom: 4mm; font-size: 5.6pt; color: var(--encre-douce); display: flex; justify-content: space-between; }
  .boutons { display: flex; justify-content: center; margin: 0 0 14px; }
  .boutons button { padding: 9px 18px; border: 0; border-radius: 4px; background: var(--encre); color: #f4efe4; font: 600 14px var(--texte); cursor: pointer; }
  @media print { body { background: none; } .affiche { margin: 0; box-shadow: none; } .boutons { display: none; } }
</style>
</head>
<body>
<main class="affiche">
  <figure class="tirage" style="margin-left:0;margin-right:0;margin-bottom:0">
    <img src="img/affiche/illustration.webp" alt="Bordeaux en maquette : la Bourse et le miroir d'eau, le Grand Théâtre, la cathédrale, la tour Pey-Berland, le pont de pierre, la Cité du Vin et le pont Chaban-Delmas">
  </figure>
  <section class="scan">
    <div class="qr" id="qr"></div>
    <div>
      <p class="themes">MUSÉES · FAMILLES · SHOPPING</p>
      <p class="fr">Scannez pour explorer la carte</p>
      <p class="en">Scan with your phone camera to explore the map</p>
      <p class="url" id="url"></p>
      <p class="langues">FRANÇAIS · ENGLISH · ESPAÑOL · ITALIANO · DEUTSCH</p>
    </div>
  </section>
  <div class="pied"><span id="hotel"></span><span id="credit">Illustration générée par IA</span></div>
</main>
<div class="boutons"><button onclick="print()">Imprimer l’affiche (A5)</button></div>
<script src="vendor/qrcode.js"></script>
<script type="module" src="js/affiche.js"></script>
</body>
</html>
